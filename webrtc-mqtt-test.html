<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>WebRTC Video Test</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            padding: 20px;
        }

        #video {
            width: 640px;
            height: 360px;
            background: black;
            display: block;
        }

        #status {
            margin-top: 15px;
            white-space: pre-line;
        }

        #session {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            word-break: break-all;
        }

    </style>

</head>


<body>

<h2>Raspberry Pi WebRTC Video</h2>


<video
    id="video"
    autoplay
    playsinline
    muted
    controls>
</video>


<div id="status">
    Starting...
</div>


<div id="session">
    Session: creating...
</div>


<script src="https://unpkg.com/mqtt@5.14.1/dist/mqtt.min.js"></script>


<script>

// ============================================================
// MQTT
// ============================================================

const MQTT_URL =
    "wss://connect.smartnode.in:8084/mqtt";


// ============================================================
// MQTT TOPICS
// ============================================================

// Browser -> Raspberry Pi
const REQUEST_TOPIC =
    "smartnode/test/webrtc/request";


// Base topic for session-specific offers/answers
const OFFER_TOPIC_PREFIX =
    "smartnode/test/webrtc/offer";

const ANSWER_TOPIC_PREFIX =
    "smartnode/test/webrtc/answer";


// ============================================================
// UNIQUE SESSION ID
// ============================================================

// Every browser TAB gets a different session ID.
//
// Example:
//
// Tab 1 -> 8a123...
// Tab 2 -> b91de...
// Tab 3 -> f721c...
//
// Therefore tabs never process each other's SDP.

const sessionId =
    crypto.randomUUID();


console.log(
    "Session ID:",
    sessionId
);


document.getElementById("session").textContent =
    "Session: " + sessionId;


// ============================================================
// SESSION TOPICS
// ============================================================

const OFFER_TOPIC =
    `${OFFER_TOPIC_PREFIX}/${sessionId}`;

const ANSWER_TOPIC =
    `${ANSWER_TOPIC_PREFIX}/${sessionId}`;


console.log(
    "Offer topic:",
    OFFER_TOPIC
);

console.log(
    "Answer topic:",
    ANSWER_TOPIC
);


// ============================================================
// DOM
// ============================================================

const video =
    document.getElementById("video");

const status =
    document.getElementById("status");


// ============================================================
// WEBRTC
// ============================================================

let pc = null;

let offerReceived = false;

let answerPublished = false;


// ============================================================
// STATUS LOG
// ============================================================

function log(message) {

    console.log(message);

    status.textContent +=
        "\n" + message;

}


// ============================================================
// ICE SERVERS
// ============================================================

const ICE_SERVERS = [

    { urls: "stun:stun.l.google.com:19302" },

    { urls: "stun:stun1.l.google.com:19302" },

    { urls: "stun:stun2.l.google.com:19302" },

    { urls: "stun:stun3.l.google.com:19302" },

    { urls: "stun:stun4.l.google.com:19302" },

    { urls: "stun:stun.flashdance.cx:3478" },

    { urls: "stun:stun.services.mozilla.com" },

    { urls: "stun:stun.skyway.io:3478" }

];


// ============================================================
// MQTT CONNECT
// ============================================================

log(
    "Connecting MQTT..."
);


const client = mqtt.connect(
    MQTT_URL,
    {

        clientId:
            "browser-webrtc-" +
            sessionId.replace(/-/g, "").substring(0, 20),

        username: "sn_server",

        password: "54L8MdjWDXw6vKk",

        clean: true,

        reconnectPeriod: 2000,

        keepalive: 30

    }
);


// ============================================================
// MQTT CONNECTED
// ============================================================

client.on(
    "connect",
    () => {

        log(
            "MQTT connected"
        );


        // ====================================================
        // SUBSCRIBE TO THIS SESSION'S OFFER
        // ====================================================

        client.subscribe(
            OFFER_TOPIC,
            { qos: 0 },

            (err) => {

                if (err) {

                    console.error(
                        "Offer subscribe error:",
                        err
                    );

                    log(
                        "ERROR subscribing to offer"
                    );

                    return;
                }


                log(
                    "Subscribed to: " +
                    OFFER_TOPIC
                );


                // =================================================
                // NOW ASK PI TO CREATE THIS SESSION
                // =================================================

                requestSession();

            }
        );

    }
);


// ============================================================
// MQTT ERROR
// ============================================================

client.on(
    "error",
    (err) => {

        console.error(
            "MQTT error:",
            err
        );

        log(
            "MQTT ERROR: " +
            err.message
        );

    }
);


// ============================================================
// MQTT RECONNECT
// ============================================================

client.on(
    "reconnect",
    () => {

        log(
            "MQTT reconnecting..."
        );

    }
);


// ============================================================
// REQUEST WEBRTC SESSION
// ============================================================

function requestSession() {

    log(
        "Requesting Raspberry Pi WebRTC session..."
    );


    const payload = {

        sessionId:

            sessionId,

        action:

            "start"

    };


    client.publish(

        REQUEST_TOPIC,

        JSON.stringify(payload),

        { qos: 0 },

        (err) => {

            if (err) {

                console.error(
                    "Session request failed:",
                    err
                );

                log(
                    "Session request failed"
                );

                return;
            }


            log(
                "Session request sent"
            );

        }

    );

}


// ============================================================
// MQTT MESSAGE
// ============================================================

client.on(
    "message",

    async (topic, message) => {

        // ====================================================
        // ONLY PROCESS OUR OWN OFFER TOPIC
        // ====================================================

        if (topic !== OFFER_TOPIC) {

            return;

        }


        // ====================================================
        // PROTECT AGAINST DUPLICATE OFFER
        // ====================================================

        if (offerReceived) {

            console.log(
                "Duplicate offer ignored"
            );

            return;

        }


        try {

            const offer =
                JSON.parse(
                    message.toString()
                );


            console.log(
                "Pi offer received:",
                offer
            );


            // =================================================
            // VERIFY SESSION
            // =================================================

            if (
                offer.sessionId !==
                sessionId
            ) {

                console.error(
                    "Session ID mismatch"
                );

                return;

            }


            offerReceived = true;


            log(
                "Pi offer received"
            );


            log(
                "Session: " +
                offer.sessionId
            );


            await startWebRTC(
                offer
            );

        }

        catch (err) {

            console.error(
                "Offer processing error:",
                err
            );

            log(
                "ERROR: " +
                err.message
            );

        }

    }

);


// ============================================================
// WEBRTC
// ============================================================

async function startWebRTC(
    offer
) {

    // ========================================================
    // PROTECT AGAINST DUPLICATE CONNECTION
    // ========================================================

    if (pc) {

        console.log(
            "PeerConnection already exists"
        );

        return;

    }


    log(
        "Creating PeerConnection..."
    );


    // ========================================================
    // CREATE PEER CONNECTION
    // ========================================================

    pc =
        new RTCPeerConnection({

            iceServers:
                ICE_SERVERS,

            iceCandidatePoolSize:
                10

        });


    console.log(
        "PeerConnection:",
        pc
    );


    // ========================================================
    // ONTRACK
    // ========================================================
    //
    // IMPORTANT:
    // Register this BEFORE setRemoteDescription().
    //
    // ========================================================

    pc.ontrack =
        async (event) => {

            console.log(
                "========== ONTRACK =========="
            );


            console.log(
                "Track:",
                event.track
            );


            console.log(
                "Kind:",
                event.track.kind
            );


            console.log(
                "Streams:",
                event.streams
            );


            console.log(
                "Track readyState:",
                event.track.readyState
            );


            console.log(
                "=============================="
            );


            if (
                event.track.kind !==
                "video"
            ) {

                return;

            }


            log(
                "Remote video track received"
            );


            // =================================================
            // GET MEDIA STREAM
            // =================================================

            let stream;


            if (
                event.streams &&
                event.streams.length > 0
            ) {

                stream =
                    event.streams[0];

            }

            else {

                stream =
                    new MediaStream();


                stream.addTrack(
                    event.track
                );

            }


            // =================================================
            // ASSIGN VIDEO
            // =================================================

            video.srcObject =
                stream;


            console.log(
                "video.srcObject:",
                video.srcObject
            );


            // =================================================
            // VIDEO METADATA
            // =================================================

            video.onloadedmetadata =
                async () => {

                    console.log(
                        "loadedmetadata"
                    );


                    console.log(
                        "videoWidth:",
                        video.videoWidth
                    );


                    console.log(
                        "videoHeight:",
                        video.videoHeight
                    );


                    log(
                        "Video dimensions: " +
                        video.videoWidth +
                        "x" +
                        video.videoHeight
                    );


                    try {

                        await video.play();


                        console.log(
                            "VIDEO PLAYING"
                        );


                        log(
                            "Video playback started"
                        );

                    }

                    catch (err) {

                        console.error(
                            "video.play() failed:",
                            err
                        );


                        log(
                            "Playback error: " +
                            err.message
                        );

                    }

                };


            // =================================================
            // EXPLICIT PLAY
            // =================================================

            try {

                await video.play();

                console.log(
                    "video.play() completed"
                );

            }

            catch (err) {

                console.log(
                    "Initial play() waiting:",
                    err.message
                );

            }

        };


    // ========================================================
    // ICE CONNECTION STATE
    // ========================================================

    pc.oniceconnectionstatechange =
        () => {

            const state =
                pc.iceConnectionState;


            log(
                "ICE state: " +
                state
            );


            if (
                state === "failed"
            ) {

                log(
                    "❌ ICE connection failed"
                );

            }


            if (
                state === "connected" ||
                state === "completed"
            ) {

                log(
                    "✅ ICE connected"
                );

            }

        };


    // ========================================================
    // WEBRTC CONNECTION STATE
    // ========================================================

    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;


            log(
                "WebRTC state: " +
                state
            );


            if (
                state === "connected"
            ) {

                log(
                    "✅ WebRTC connected"
                );

            }


            if (
                state === "failed"
            ) {

                log(
                    "❌ WebRTC connection failed"
                );

            }


            if (
                state === "disconnected"
            ) {

                log(
                    "⚠️ WebRTC disconnected"
                );

            }

        };


    // ========================================================
    // ICE GATHERING
    // ========================================================

    pc.onicegatheringstatechange =
        () => {

            console.log(
                "Browser ICE gathering:",
                pc.iceGatheringState
            );

        };


    // ========================================================
    // ICE CANDIDATE DEBUG
    // ========================================================

    pc.onicecandidate =
        (event) => {

            if (event.candidate) {

                console.log(
                    "Browser ICE candidate:",
                    event.candidate.candidate
                );

            }

            else {

                console.log(
                    "Browser ICE gathering complete"
                );

            }

        };


    // ========================================================
    // REMOTE OFFER
    // ========================================================

    log(
        "Setting remote description..."
    );


    await pc.setRemoteDescription({

        type:
            "offer",

        sdp:
            offer.sdp

    });


    log(
        "Remote SDP set"
    );


    // ========================================================
    // CREATE ANSWER
    // ========================================================

    log(
        "Creating answer..."
    );


    const answer =
        await pc.createAnswer();


    await pc.setLocalDescription(
        answer
    );


    log(
        "Local answer created"
    );


    // ========================================================
    // WAIT FOR ICE
    // ========================================================

    if (
        pc.iceGatheringState !==
        "complete"
    ) {

        await new Promise(
            (resolve) => {

                const check = () => {

                    if (
                        pc.iceGatheringState ===
                        "complete"
                    ) {

                        pc.removeEventListener(
                            "icegatheringstatechange",
                            check
                        );


                        resolve();

                    }

                };


                pc.addEventListener(
                    "icegatheringstatechange",
                    check
                );


                check();

            }
        );

    }


    log(
        "Browser ICE gathering complete"
    );


    // ========================================================
    // PREVENT DUPLICATE ANSWER
    // ========================================================

    if (answerPublished) {

        console.log(
            "Answer already published"
        );

        return;

    }


    // ========================================================
    // ANSWER PAYLOAD
    // ========================================================

    const payload = {

        sessionId:

            sessionId,

        type:

            "answer",

        sdp:

            pc.localDescription.sdp

    };


    // ========================================================
    // PUBLISH ANSWER
    // ========================================================

    client.publish(

        ANSWER_TOPIC,

        JSON.stringify(payload),

        { qos: 0 },

        (err) => {

            if (err) {

                console.error(
                    "Answer publish error:",
                    err
                );


                log(
                    "❌ Answer publish failed"
                );


                return;

            }


            answerPublished = true;


            log(
                "✅ ANSWER published"
            );


            console.log(
                "Answer topic:",
                ANSWER_TOPIC
            );

        }

    );

}


// ============================================================
// VIDEO DEBUGGING
// ============================================================

setInterval(
    () => {

        if (!pc) {

            return;

        }


        console.log(
            "VIDEO DEBUG:",
            {

                readyState:
                    video.readyState,

                paused:
                    video.paused,

                ended:
                    video.ended,

                videoWidth:
                    video.videoWidth,

                videoHeight:
                    video.videoHeight,

                currentTime:
                    video.currentTime,

                srcObject:
                    video.srcObject,

                connectionState:
                    pc.connectionState,

                iceState:
                    pc.iceConnectionState

            }
        );


    },
    5000
);


// ============================================================
// CLOSE / CLEANUP
// ============================================================

async function stopSession() {

    console.log(
        "Stopping session:",
        sessionId
    );


    // ========================================================
    // TELL PI TO STOP THIS SESSION
    // ========================================================

    if (
        client &&
        client.connected
    ) {

        const payload = {

            sessionId:
                sessionId,

            action:
                "stop"

        };


        client.publish(

            REQUEST_TOPIC,

            JSON.stringify(payload),

            {
                qos: 0,
                retain: false
            }

        );

    }


    // ========================================================
    // CLOSE PEER CONNECTION
    // ========================================================

    if (pc) {

        try {

            pc.close();

        }

        catch (_) {}

        pc = null;

    }


    // ========================================================
    // STOP VIDEO
    // ========================================================

    if (video.srcObject) {

        try {

            video.srcObject
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }

        catch (_) {}

        video.srcObject = null;

    }

}


// ============================================================
// PAGE CLOSE
// ============================================================

window.addEventListener(
    "beforeunload",
    () => {

        // Do not use async here.
        //
        // Just publish the stop message if
        // MQTT is still connected.

        if (
            client &&
            client.connected
        ) {

            client.publish(

                REQUEST_TOPIC,

                JSON.stringify({

                    sessionId:
                        sessionId,

                    action:
                        "stop"

                }),

                {
                    qos: 0,
                    retain: false
                }

            );

        }

    }
);

</script>

</body>

</html>
