<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebRTC Video Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            padding: 20px;
        }

        #video {
            width: 640px;
            height: 360px;
            background: black;
            display: block;
        }

        #status {
            margin-top: 15px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

<h2>Raspberry Pi WebRTC Video</h2>

<video
    id="video"
    autoplay
    playsinline
    muted
    controls>
</video>

<div id="status">Starting...</div>

<script src="https://unpkg.com/mqtt@5.14.1/dist/mqtt.min.js"></script>

<script>

const MQTT_URL = "wss://connect.smartnode.in:8084/mqtt";

const OFFER_TOPIC =
    "smartnode/test/webrtc/offer";

const ANSWER_TOPIC =
    "smartnode/test/webrtc/answer";

const video =
    document.getElementById("video");

const status =
    document.getElementById("status");

let pc = null;


// ============================================================
// STATUS
// ============================================================

function log(message) {

    console.log(message);

    status.textContent +=
        "\n" + message;
}


// ============================================================
// MQTT
// ============================================================

log("Connecting MQTT...");

const client = mqtt.connect(MQTT_URL, {

    clientId:
        "browser-webrtc-" +
        Date.now(),
    username: 'sn_server',
    password: '54L8MdjWDXw6vKk',
    clean: true,

    reconnectPeriod: 2000
});


client.on("connect", () => {

    log("MQTT connected");

    client.subscribe(
        OFFER_TOPIC,
        { qos: 0 },
        (err) => {

            if (err) {

                console.error(
                    "Subscribe error:",
                    err
                );

                return;
            }

            log(
                "Subscribed to: " +
                OFFER_TOPIC
            );

            log(
                "Waiting for Raspberry Pi offer..."
            );
        }
    );
});


client.on("error", (err) => {

    console.error(
        "MQTT error:",
        err
    );
});


// ============================================================
// MQTT MESSAGE
// ============================================================

client.on(
    "message",
    async (topic, message) => {

        if (topic !== OFFER_TOPIC) {
            return;
        }

        try {

            const offer =
                JSON.parse(
                    message.toString()
                );

            log(
                "Pi offer received"
            );

            log(
                "Session: " +
                offer.sessionId
            );

            await startWebRTC(offer);

        }
        catch (err) {

            console.error(
                "Offer processing error:",
                err
            );

            log(
                "ERROR: " +
                err.message
            );
        }
    }
);


// ============================================================
// WEBRTC
// ============================================================

async function startWebRTC(offer) {

    log(
        "Creating PeerConnection..."
    );

    pc = new RTCPeerConnection({

        iceServers: [
            {
                urls:
                    "stun:stun.l.google.com:19302"
            }
        ]
    });


    // ========================================================
    // IMPORTANT: ONTRACK
    // ========================================================

    pc.ontrack = async (event) => {

        console.log(
            "========== ONTRACK =========="
        );

        console.log(
            "Track:",
            event.track
        );

        console.log(
            "Kind:",
            event.track.kind
        );

        console.log(
            "Streams:",
            event.streams
        );

        console.log(
            "Track readyState:",
            event.track.readyState
        );

        console.log(
            "=============================="
        );


        if (event.track.kind !== "video") {

            return;
        }


        log(
            "Remote video track received"
        );


        // ----------------------------------------------------
        // IMPORTANT
        // ----------------------------------------------------

        let stream;


        if (
            event.streams &&
            event.streams.length > 0
        ) {

            stream =
                event.streams[0];

        }
        else {

            // Fallback in case the stream
            // is not supplied with the event.

            stream =
                new MediaStream();

            stream.addTrack(
                event.track
            );
        }


        console.log(
            "Using MediaStream:",
            stream
        );


        video.srcObject =
            stream;


        console.log(
            "video.srcObject:",
            video.srcObject
        );


        // ----------------------------------------------------
        // Wait until browser knows video dimensions
        // ----------------------------------------------------

        video.onloadedmetadata =
            async () => {

                console.log(
                    "loadedmetadata"
                );

                console.log(
                    "videoWidth:",
                    video.videoWidth
                );

                console.log(
                    "videoHeight:",
                    video.videoHeight
                );


                log(
                    "Video dimensions: " +
                    video.videoWidth +
                    "x" +
                    video.videoHeight
                );


                try {

                    await video.play();

                    console.log(
                        "VIDEO PLAYING"
                    );

                    log(
                        "Video playback started"
                    );

                }
                catch (err) {

                    console.error(
                        "video.play() failed:",
                        err
                    );

                    log(
                        "Playback error: " +
                        err.message
                    );
                }
            };


        // Also explicitly call play
        // in case metadata has already loaded.

        try {

            await video.play();

            console.log(
                "video.play() completed"
            );

        }
        catch (err) {

            console.log(
                "Initial play() waiting:",
                err.message
            );
        }
    };


    // ========================================================
    // ICE
    // ========================================================

    pc.oniceconnectionstatechange =
        () => {

            log(
                "ICE state: " +
                pc.iceConnectionState
            );
        };


    pc.onconnectionstatechange =
        () => {

            log(
                "WebRTC state: " +
                pc.connectionState
            );
        };


    pc.onicegatheringstatechange =
        () => {

            console.log(
                "Browser ICE gathering:",
                pc.iceGatheringState
            );
        };


    // ========================================================
    // REMOTE OFFER
    // ========================================================

    log(
        "Setting remote description..."
    );

    await pc.setRemoteDescription({

        type: "offer",

        sdp: offer.sdp

    });


    log(
        "Remote SDP set"
    );


    // ========================================================
    // CREATE ANSWER
    // ========================================================

    log(
        "Creating answer..."
    );

    const answer =
        await pc.createAnswer();


    await pc.setLocalDescription(
        answer
    );


    log(
        "Local answer created"
    );


    // ========================================================
    // WAIT FOR ICE
    // ========================================================

    if (
        pc.iceGatheringState !==
        "complete"
    ) {

        await new Promise(
            resolve => {

                const check = () => {

                    if (
                        pc.iceGatheringState ===
                        "complete"
                    ) {

                        pc.removeEventListener(
                            "icegatheringstatechange",
                            check
                        );

                        resolve();
                    }
                };


                pc.addEventListener(
                    "icegatheringstatechange",
                    check
                );


                check();
            }
        );
    }


    log(
        "Browser ICE gathering complete"
    );


    // ========================================================
    // SEND ANSWER
    // ========================================================

    client.publish(

        ANSWER_TOPIC,

        JSON.stringify({

            sessionId:
                offer.sessionId,

            type:
                "answer",

            sdp:
                pc.localDescription.sdp

        }),

        { qos: 0 },

        (err) => {

            if (err) {

                console.error(
                    "Answer publish error:",
                    err
                );

                return;
            }

            log(
                "ANSWER published"
            );
        }
    );
}


// ============================================================
// VIDEO DEBUGGING
// ============================================================

setInterval(() => {

    if (!pc) {
        return;
    }

    console.log(
        "VIDEO DEBUG:",
        {
            readyState:
                video.readyState,

            paused:
                video.paused,

            ended:
                video.ended,

            videoWidth:
                video.videoWidth,

            videoHeight:
                video.videoHeight,

            currentTime:
                video.currentTime,

            srcObject:
                video.srcObject,

            connectionState:
                pc.connectionState,

            iceState:
                pc.iceConnectionState
        }
    );

}, 2000);

</script>

</body>
</html>
